about    = "Re-render the Times progress page (tools/gale_fetch.py's downloads) and the Listener checklist, mirror the Listener inbox, and start the full pass when an edition gale_fetch laid out waits and none runs"
room     = "cryptic-crosswords"
# Every minute: the Listener checklist's rows say "downloading..." until a
# tick sees the file arrive. A tick that finds nothing new is one ssh
# listing (the Listener inbox), the Listener page's small status file and a
# worktree reset; it re-renders the Times progress page when
# tools/gale_fetch.py logged a download, or hourly. It asks Gale only for Listener links not yet looked up (the
# Times rows are looked up by tools/gale_fetch.py). A tick still running
# when the next is due holds the plugin's flock, so that one is skipped.
schedule = "* * * * *"
where    = "container"
# The job's own worktree, which tools/nightly_worktree.sh resets to
# origin/master on every tick, so a pushed fix is live at the next tick.
run      = "/Users/pt/.cryptic-teacher/gale_inbox/tools/gale_inbox.sh"
args     = ["sync"]
log      = "/Users/pt/github/cryptic-teacher/.gale_inbox.log"
timeout  = 900

[env]
XDG_CONFIG_HOME  = "/Users/pt/.config"
CT_WORKTREE_ROOT = "/Users/pt/.cryptic-teacher"
