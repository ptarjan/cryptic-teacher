about    = "Sweep Gale pages downloaded by hand (the Listener's, any Times one) into their inboxes on the Media share, stage them, re-render the Times progress page and the Listener checklist, and start the reads of new editions (tools/gale_fetch.py's too)"
room     = "cryptic-crosswords"
# Every minute: the Listener checklist's rows say "downloading..." until a
# tick sees the file arrive. A tick that finds nothing new is two ssh
# listings (Mac, desktop), the Listener page's small status file and a
# worktree reset; it stages only when a file moved, or hourly, and
# re-renders the Times progress page when tools/gale_fetch.py logged a
# download. It asks Gale only for Listener links not yet looked up (the
# Times rows are looked up by tools/gale_fetch.py). A tick still running
# when the next is due holds the plugin's flock, so that one is skipped.
schedule = "* * * * *"
where    = "container"
# The job's own worktree, which tools/nightly_worktree.sh resets to
# origin/master on every tick, so a pushed fix is live at the next tick.
run      = "/Users/pt/.cryptic-teacher/gale_inbox/tools/gale_inbox.sh"
args     = ["sync"]
log      = "/Users/pt/github/cryptic-teacher/.gale_inbox.log"
timeout  = 900

[env]
XDG_CONFIG_HOME  = "/Users/pt/.config"
CT_WORKTREE_ROOT = "/Users/pt/.cryptic-teacher"
