about    = "Re-render the Times progress page (tools/gale_fetch.py's downloads) and start the full pass when an edition gale_fetch laid out waits and none runs"
room     = "cryptic-crosswords"
# Every minute, so a page tools/gale_fetch.py laid out while no full pass
# runs is read within minutes (kick). A tick that finds nothing new is a
# worktree reset; it re-renders the Times progress page when
# tools/gale_fetch.py logged a download, or hourly. It asks Gale nothing.
# A tick still running when the next is due holds the plugin's flock, so
# that one is skipped.
schedule = "* * * * *"
where    = "container"
# The main checkout's copy, only to bootstrap: tools/nightly_worktree.sh
# (re)creates the job's own worktree under ~/.cryptic-teacher at origin/master
# and runs that tree's copy of the script, so a pushed fix is live at the
# next run. Never point run (or this plugin's symlink) INTO a job tree: when
# the tree went (2026-10-24, and vlm_health removes its own after every run)
# the bridge listed the plugin as disabled and nothing ran to rebuild it; the
# coverage ledger went unsaved 10-24..10-28.
run      = "~/github/cryptic-teacher/tools/gale_inbox.sh"
args     = ["sync"]
log      = "~/github/cryptic-teacher/.gale_inbox.log"
timeout  = 900

