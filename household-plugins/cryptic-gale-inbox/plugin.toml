about    = "Sweep the Gale pages Paul downloads by hand into their inboxes on the Media share, stage them and re-render the checklist, so it ticks each one off within minutes"
room     = "cryptic-crosswords"
# Every minute: Paul works through the checklist with it open, and its rows
# say "downloading..." until a tick sees the file arrive, so a slow tick is a
# row he cannot tell from a failed download. A tick that finds nothing new is
# two ssh listings (Mac, desktop), the two pages' small status files and a
# worktree reset; it stages and re-renders only when a file moved, or hourly.
# It asks Gale only for the links not yet looked up. A tick still running
# when the next is due holds the plugin's flock, so that one is skipped.
schedule = "* * * * *"
where    = "container"
# The job's own worktree, which tools/nightly_worktree.sh resets to
# origin/master on every tick, so a pushed fix is live within 3 minutes.
run      = "/Users/pt/.cryptic-teacher/gale_inbox/tools/gale_inbox.sh"
args     = ["sync"]
log      = "/Users/pt/github/cryptic-teacher/.gale_inbox.log"
timeout  = 900

[env]
XDG_CONFIG_HOME  = "/Users/pt/.config"
CT_WORKTREE_ROOT = "/Users/pt/.cryptic-teacher"
