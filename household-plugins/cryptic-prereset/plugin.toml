about    = "Spend every five-hour usage window on annotation backfills"
room     = "cryptic-crosswords"
# Hourly: a run already going holds the lock and the fire is a no-op; otherwise
# it starts a burn that spends every five-hour window until the weekly meter is
# spent or the week resets. The reasoning is in the script's own header.
schedule = "5 * * * *"
where    = "container"
run      = "/Users/pt/github/cryptic-teacher/tools/prereset_backfill.sh"
log      = "/Users/pt/github/cryptic-teacher/.prereset.log"
# No limit: a burn runs until the weekly meter is spent or the week resets.
timeout  = 0

[env]
XDG_CONFIG_HOME  = "/Users/pt/.config"
CT_WORKTREE_ROOT = "/Users/pt/.cryptic-teacher"
