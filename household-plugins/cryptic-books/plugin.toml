about    = "Tick of the archive.org books' unit queue: one loan or one book's read a unit (tools/book_units.py), each its own detached process"
room     = "cryptic-crosswords"
# Every ten minutes, and usually a few seconds: a tick plans and starts what is
# due. Loans wait on archive.org's lending limit, which counts loans TAKEN over
# a period archive.org does not publish and is not cleared by returning
# anything, so asking is the only way to find it; after a refusal
# tools/book_units.py asks again an hour later (REFUSAL_WAIT), as the hourly
# schedule Paul asked for on 2026-10-05 did. A book borrowed is read at the
# next tick, beside any other read (.books.log has every loan and refusal).
schedule = "*/10 * * * *"
where    = "container"
run      = "~/github/cryptic-teacher/tools/acquire_books.sh"
# The transcript is how a run that went wrong is read back; the scheduler's
# own stdout goes to `docker logs`, where nothing looks for it.
log      = "~/github/cryptic-teacher/.books.log"
# The tick only plans; the units' limits are their own (tools/book_units.py).
timeout  = 600
