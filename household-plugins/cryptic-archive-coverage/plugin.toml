about    = "The coverage ledger (tools/coverage.py): every series' puzzles that exist, filed, and each missing one bucketed by cause and owning module; queues the top recoverable buckets and any regression for #cryptic-crosswords"
room     = "cryptic-crosswords"
schedule = "50 5 * * *"
where    = "container"
# The main checkout's copy, only to bootstrap: tools/nightly_worktree.sh
# (re)creates the job's own worktree under ~/.cryptic-teacher at origin/master
# and runs that tree's copy of the script, so a pushed fix is live at the
# next run. Never point run (or this plugin's symlink) INTO a job tree: when
# the tree went (2026-10-24, and vlm_health removes its own after every run)
# the bridge listed the plugin as disabled and nothing ran to rebuild it; the
# coverage ledger went unsaved 10-24..10-28.
run      = "~/github/cryptic-teacher/tools/coverage.sh"
args     = ["daily"]
log      = "~/github/cryptic-teacher/.coverage.log"
timeout  = 1800

