about    = "The coverage ledger (tools/coverage.py): every series' puzzles that exist, filed, and each missing one bucketed by cause and owning module; queues the top recoverable buckets and any regression for #cryptic-crosswords"
room     = "cryptic-crosswords"
schedule = "50 5 * * *"
where    = "container"
# Run from the corpus queue's worktree, which its hourly tick resets to
# origin/master, so the script exists even when the main checkout is behind.
# tools/nightly_worktree.sh then moves the run into a worktree of its own.
run      = "/Users/pt/.cryptic-teacher/corpus_queue/tools/coverage.sh"
args     = ["daily"]
log      = "/Users/pt/github/cryptic-teacher/.coverage.log"
timeout  = 600

[env]
XDG_CONFIG_HOME  = "/Users/pt/.config"
CT_WORKTREE_ROOT = "/Users/pt/.cryptic-teacher"
