# The clock that publishes puzzle-only pushes.
#
# pages.yml no longer builds the site for a push that only added or edited
# puzzle files (tools/ci_scope.py): that push runs just the annotation check
# (about a minute), because the site build and deploy are ~5 minutes of work
# (reindex, ~67k pages, a 1GB artifact, the whole site uploaded every time) that
# a burn filing a puzzle every few minutes would otherwise queue up forever.
# Code pushes still build and deploy on the push, as before.
#
# So this runs every 15 minutes and starts the build only when master has moved
# since the commit the live site was last deployed from (tools/last_deploy.py),
# and none is already on its way. The site goes live up to ~15 minutes after a
# puzzle push; that lag was accepted (Paul, 10-19).
#
# It dispatches pages.yml rather than building here: the build must share
# pages.yml's `pages` concurrency group (one deploy at a time; a dispatched run
# queues behind a running build and, being the newest pending one, replaces an
# older pending one, which is right since it builds a later commit), and a
# run of pages.yml is what the budgets and the next run's diff base read. A
# workflow_dispatch made with the workflow's token is allowed, and starts a run.
#
# The daily run is the full annotation check pages.yml used to schedule itself
# (see its validate job): whatever the day's pushes changed, `full=true` makes
# both the check and the build take their full paths.
name: Start the site deploy on a schedule

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write      # to dispatch pages.yml
  deployments: read   # tools/last_deploy.py

# Two ticks never overlap; a late one is dropped, the next covers it.
concurrency:
  group: pages-schedule
  cancel-in-progress: false

jobs:
  dispatch:
    name: dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            tools/last_deploy.py
          sparse-checkout-cone-mode: false
      - name: Start the build when master moved
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ "$SCHEDULE" = "41 9 * * *" ]; then
            echo "the daily full check and build"
            gh workflow run pages.yml --repo "$REPO" --ref master -f full=true
            exit 0
          fi
          if [ "$(python3 tools/last_deploy.py "$REPO" --moved)" != yes ]; then
            echo "master is what the site was last deployed from: nothing to do"
            exit 0
          fi
          head=$(gh api "repos/$REPO/commits/master" --jq .sha)
          # A build of this very commit already queued or running (a code push
          # builds on the push): a second one would deploy the same site again.
          # A run waiting for the pages group reports "pending", not "queued".
          for status in pending waiting queued in_progress; do
            while read -r id; do
              [ -n "$id" ] || continue
              coming=$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                         --jq '[.jobs[] | select(.name == "build" and .conclusion != "skipped")] | length')
              if [ "$coming" -gt 0 ]; then
                echo "run $id is already building ${head:0:8}"
                exit 0
              fi
            done < <(gh api "repos/$REPO/actions/workflows/pages.yml/runs?status=$status&per_page=30" \
                       --jq ".workflow_runs[] | select(.head_sha == \"$head\") | .id")
          done
          echo "master is at ${head:0:8}, not deployed: starting the build"
          gh workflow run pages.yml --repo "$REPO" --ref master
