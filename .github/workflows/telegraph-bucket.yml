# bucket:telegraph moved off the home server (Paul 2026-11-15: "Jobs should be on ci where
# possible"): tools/fetch_telegraph.py --holes all, every hole of the Telegraph's own
# puzzle bucket, oldest first, each filed as its own "File <id>" commit.
#
# The raw fetch cache (telegraph-source, tools/downloads.py TELEGRAPH) is the cache of
# this job and its only writer now (cross_validate.py telegraph --fetch and
# extend_archive.py stay manual):
#   * restored from actions/cache; when that is empty (first run, or evicted) it is seeded
#     from the draft release asset cache-seed-telegraph-source, made once from the media
#     copy (a draft is not public; raw cache contents never go in the repo);
#   * saved again when the run fetched anything;
#   * each run's NEW files go up as the artifact cache-telegraph-source-<run id>, kept 90
#     days, which the home server's cache-sync unit (tools/cache_sync.py) lands on the media
#     disk and then deletes. The media disk stays the mirror the local readers use.
# The schedule is every six hours: a run that spent its budget leaves holes for the next.
# The job fails (red) when a fetch fails and nothing was fetched, as the local unit did.
name: Telegraph bucket

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: telegraph-bucket
  cancel-in-progress: false

jobs:
  bucket:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      CT_DOWNLOADS: /tmp/cryptic-downloads
      CACHE_DIR: /tmp/cryptic-downloads/telegraph-source
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 100
          token: ${{ secrets.PUSH_TOKEN || github.token }}
      - uses: ./.github/actions/setup
        with:
          pip: numpy pillow pypdf opencv-python-headless
      - name: Restore the cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/cryptic-downloads/telegraph-source
          key: telegraph-source-${{ github.run_id }}
          restore-keys: telegraph-source-
      - name: Seed an empty cache from the draft release asset
        id: seed
        if: steps.cache.outputs.cache-hit == '' && steps.cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            '[.[] | select(.tag_name=="cache-seed-telegraph-source")][0].assets[] | select(.name=="telegraph-source-seed.tgz") | .id')
          [ -n "$id" ] || { echo "::warning::no seed asset; starting from an empty cache"; exit 0; }
          mkdir -p "$CACHE_DIR"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > /tmp/seed.tgz
          tar -xzf /tmp/seed.tgz -C "$CACHE_DIR"
          rm /tmp/seed.tgz
          echo "seeded $(find "$CACHE_DIR" -type f | wc -l) files"
          echo "seeded=1" >> "$GITHUB_OUTPUT"
      - name: List the cache before
        shell: bash
        run: |
          mkdir -p "$CACHE_DIR"
          (cd "$CACHE_DIR" && find . -type f | sort) > /tmp/cache-before.txt
          wc -l < /tmp/cache-before.txt
      - name: Fetch every hole, commit each new puzzle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rc=0
          python3 tools/fetch_telegraph.py --holes all --budget-seconds 2700 || rc=$?
          git add -A
          python3 tools/renamed_ids.py --stage
          tools/commit_puzzles.sh "daily bucket:telegraph"
          if ! git diff --cached --quiet; then
            git commit -q -m "$(printf 'Daily bucket:telegraph\n\n%s' "$(python3 tools/provenance.py trailer)")"
          fi
          left=$(git status --porcelain)
          [ -z "$left" ] || echo "::warning::left behind: $left"
          echo "fetch_rc=$rc" >> "$GITHUB_ENV"
      - name: Stage the new cache files
        id: new
        shell: bash
        run: |
          (cd "$CACHE_DIR" && find . -type f | sort) > /tmp/cache-after.txt
          mkdir -p /tmp/cache-new
          comm -13 /tmp/cache-before.txt /tmp/cache-after.txt | while read -r f; do
            mkdir -p "/tmp/cache-new/$(dirname "$f")"
            cp "$CACHE_DIR/$f" "/tmp/cache-new/$f"
          done
          n=$(find /tmp/cache-new -type f | wc -l)
          echo "new cache files: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Upload the new cache files
        if: steps.new.outputs.count != '0'
        uses: actions/upload-artifact@v5
        with:
          name: cache-telegraph-source-${{ github.run_id }}
          path: /tmp/cache-new
          retention-days: 90
          if-no-files-found: error
      - name: Save the cache
        if: steps.new.outputs.count != '0' || steps.seed.outputs.seeded == '1'
        uses: actions/cache/save@v5
        with:
          path: /tmp/cryptic-downloads/telegraph-source
          key: telegraph-source-${{ github.run_id }}
      - name: Push, rebasing when master moved
        shell: bash
        run: |
          ahead=$(git rev-list --count origin/master..HEAD 2>/dev/null || echo 0)
          if [ "$ahead" = 0 ]; then
            echo "telegraph-bucket: nothing new to push"
          else
            git log --format='%h %s' origin/master..HEAD
            pushed=""
            for n in $(seq 1 8); do
              if git push -q origin HEAD:refs/heads/master; then pushed=1; break; fi
              echo "telegraph-bucket: push $n lost the race; rebasing on the new tip"
              git fetch -q --depth=100 origin master || { sleep 5; continue; }
              if ! git rebase -q origin/master; then
                git rebase --abort
                echo "::error::rebase conflicted"
                break
              fi
              sleep $((RANDOM % 5 + 1))
            done
            [ -n "$pushed" ] || { echo "::error::could not push"; exit 1; }
            echo "telegraph-bucket: pushed $(git rev-parse --short HEAD)"
          fi
          if [ "${fetch_rc:-0}" != 0 ]; then
            echo "::error::fetch_telegraph.py exited $fetch_rc"
            exit 1
          fi
