# CodeQL code scanning, advanced setup, nightly.
#
# Default setup ran one analysis per language on every push, and the burn
# pushes one commit per puzzle, so dozens of CodeQL runs queued ahead of the
# test workflow's jobs and starved it until newer pushes cancelled it. Scanning
# once a night (and on demand) keeps the alerts without competing with CI.
# The languages are the ones default setup analysed.
name: CodeQL

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: codeql
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
