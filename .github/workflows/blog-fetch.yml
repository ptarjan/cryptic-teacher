# The Times for the Times and Big Dave blog fetches of the blog:times and blog:telegraph
# units moved off the home server (Paul 2026-11-15: "Jobs should be on ci where possible"):
# tools/fetch_wp_blog.py <blog> for the posts, and --comments for the readers' comments
# (the Times blog's; the ratings job's blog_comment_difficulty reads them off the media
# disk and stays local). Only the fetch moved. The chains' parsers and filers
# (parse_*.py, times_grids.py, file_*_puzzles.py, fetch_times_listing.py) stay in the
# local units: they read the media disk and the grid search is heavy.
#
# Each blog's cache (tools/downloads.py ROOT/<blog>/: posts/, comments/, categories.json;
# never the parsed/filed derivatives, which are the local parsers') has this job as its
# only fetcher now, and works as in fifteensquared-fetch.yml:
#   * restored from actions/cache; when empty it is seeded from the draft release asset
#     <blog>-seed.tgz of cache-seed-<blog> (made once from the media copy);
#   * saved again when the run fetched anything (older saves are deleted);
#   * each run's NEW (or changed) files go up as the artifact cache-<blog>-<run id>, kept
#     90 days, which tools/cache_sync.py (the cache-sync unit) lands on the media disk.
#     A comments month the run refetched replaces the disk's only when it holds every
#     comment the disk's has. Comments are public blog content, fine in a public artifact.
# The runner has no manifest (tools/media_manifest.py), so it builds the posts (and
# comments) one from the restored files before it fetches; the build reads local files only.
# A job is red when its fetch fails, after what it did get is uploaded.
name: Blog fetch

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write   # draft releases are visible to a writing token only (the seed asset)
  actions: write

jobs:
  fetch:
    strategy:
      fail-fast: false
      matrix:
        blog: [timesforthetimes, bigdave44]
    concurrency:
      group: blog-fetch-${{ matrix.blog }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CT_DOWNLOADS: /tmp/cryptic-downloads
      CACHE_DIR: /tmp/cryptic-downloads/${{ matrix.blog }}
      BLOG: ${{ matrix.blog }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools
      - name: Restore the cache
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/cryptic-downloads/${{ matrix.blog }}
          key: blog-${{ matrix.blog }}-${{ github.run_id }}
          restore-keys: blog-${{ matrix.blog }}-
      - name: Seed an empty cache from the draft release asset
        id: seed
        if: steps.cache.outputs.cache-hit == '' && steps.cache.outputs.cache-matched-key == ''
        shell: bash
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq \
            "[.[] | select(.tag_name==\"cache-seed-$BLOG\")][0].assets[] | select(.name==\"$BLOG-seed.tgz\") | .id")
          [ -n "$id" ] || { echo "::warning::no seed asset; starting from an empty cache"; exit 0; }
          mkdir -p "$CACHE_DIR"
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > /tmp/seed.tgz
          tar -xzf /tmp/seed.tgz -C "$CACHE_DIR"
          rm /tmp/seed.tgz
          echo "seeded $(find "$CACHE_DIR" -type f | wc -l) files"
          echo "seeded=1" >> "$GITHUB_OUTPUT"
      - name: Checksum the cache before, and build the runner's manifests
        shell: bash
        run: |
          mkdir -p "$CACHE_DIR/posts" "$CACHE_DIR/comments"
          (cd "$CACHE_DIR" && find . -type f -exec md5sum {} + | LC_ALL=C sort) > /tmp/cache-before.txt
          wc -l < /tmp/cache-before.txt
          python3 tools/media_manifest.py build "posts-$BLOG"
          python3 tools/media_manifest.py build "comments-$BLOG"
      - name: Fetch the posts
        shell: bash
        run: |
          rc=0
          PYTHONUNBUFFERED=1 python3 tools/fetch_wp_blog.py "$BLOG" || rc=$?
          echo "posts_rc=$rc" >> "$GITHUB_ENV"
      - name: Fetch the comments
        if: matrix.blog == 'timesforthetimes'
        shell: bash
        run: |
          rc=0
          PYTHONUNBUFFERED=1 python3 tools/fetch_wp_blog.py "$BLOG" --comments || rc=$?
          echo "comments_rc=$rc" >> "$GITHUB_ENV"
      - name: Stage the new and changed cache files
        id: new
        shell: bash
        run: |
          (cd "$CACHE_DIR" && find . -type f -exec md5sum {} + | LC_ALL=C sort) > /tmp/cache-after.txt
          mkdir -p /tmp/cache-new
          comm -13 /tmp/cache-before.txt /tmp/cache-after.txt | sed 's/^[0-9a-f]*  //' | while read -r f; do
            mkdir -p "/tmp/cache-new/$(dirname "$f")"
            cp "$CACHE_DIR/$f" "/tmp/cache-new/$f"
          done
          n=$(find /tmp/cache-new -type f | wc -l)
          echo "new or changed cache files: $n"
          echo "count=$n" >> "$GITHUB_OUTPUT"
      - name: Upload the new cache files
        if: steps.new.outputs.count != '0'
        uses: actions/upload-artifact@v5
        with:
          name: cache-${{ matrix.blog }}-${{ github.run_id }}
          path: /tmp/cache-new
          retention-days: 90
          if-no-files-found: error
      - name: Save the cache
        if: steps.new.outputs.count != '0' || steps.seed.outputs.seeded == '1'
        uses: actions/cache/save@v5
        with:
          path: /tmp/cryptic-downloads/${{ matrix.blog }}
          key: blog-${{ matrix.blog }}-${{ github.run_id }}
      - name: Delete the older saves of the cache
        if: steps.new.outputs.count != '0' || steps.seed.outputs.seeded == '1'
        shell: bash
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "blog-$BLOG-" --sort created_at --order desc \
            --limit 100 --json id,key -q '.[1:][] | .id' | while read -r id; do
            gh cache delete "$id" -R "$GITHUB_REPOSITORY" || true
          done
      - name: Fail when a fetch failed
        shell: bash
        run: |
          rc=0
          for v in posts_rc comments_rc; do
            if [ "${!v:-0}" != 0 ]; then echo "::error::fetch_wp_blog.py $BLOG failed ($v=${!v})"; rc=1; fi
          done
          exit $rc
