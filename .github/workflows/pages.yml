# The site is generated, then deployed. It used to be generated and COMMITTED:
# 1,057 per-puzzle pages, a hub, a sitemap and a patched homepage, all of which
# change whenever app.js or style.css does, because every one of them carries a
# content-hashed ?v= stamp. That made a one-line CSS fix a 1,059-file commit and
# put a five-minute rebuild in front of every push.
#
# So the repo holds the sources and this holds the build. Nothing under
# .gitignore's "generated by tools/build_seo_pages.py" block is committed any
# more; it is written here, on a clean checkout, and handed straight to Pages.
#
# The smoke test is not run here: tests.yml runs it on the same push, against
# pages built the same way, and a broken test must never block a deploy.
name: Build and deploy the site

on:
  push:
    branches: [master]
  workflow_dispatch:
  # The full annotation check (see validate) once a day, whatever the day's
  # pushes changed.
  schedule:
    - cron: "41 9 * * *"

permissions:
  contents: read
  actions: read  # validate reads the last successful run: its diff base; the build waits on validate
  pages: write
  id-token: write

# One deploy at a time. cancel-in-progress must stay FALSE: a push takes about
# 4 minutes to go live, longer when many social cards are redrawn, and the
# annotation backfill pushes a commit per puzzle, so
# cancelling on every push meant no build ever reached the deploy step and the
# site stopped updating while the corpus grew. There is no pile-up either way —
# GitHub keeps only the newest PENDING run in a concurrency group and cancels
# the rest — so false costs one build's latency and buys a site that ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A build takes a few minutes, a couple more when a change redraws a
    # full OG_LIMIT of social cards.
    # Without a cap a hung step holds the pages concurrency group, and so every
    # deploy behind it, for GitHub's 6 hours.
    timeout-minutes: 90
    # The deploy is this job's step (Deploy to Pages), so the job carries the
    # environment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The tree is ~54k files, ~1GB of puzzle JSON, and fetching all of it
      # from nothing was ~58s of a 66s checkout (run 38370347047) for a push
      # that changed one file. So the object store is cached between runs
      # (Save the git store) and the fetch is incremental: refs/ct/base, cached
      # with it, is the last run's commit, the fetch offers it as a have, and
      # the server sends only what was pushed since. A cold store is a full
      # fetch, as before. Written out rather than actions/checkout, which
      # deletes an existing repository's refs before it fetches and so would
      # offer no have. tools/test_ci_checkout.sh runs this script twice
      # against a local origin.
      - name: Restore the git store
        uses: actions/cache/restore@v5
        with:
          path: |
            .git/objects
            .git/shallow
            .git/refs/ct
          key: git-store-${{ github.sha }}
          restore-keys: git-store-
      - name: Check out
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every run adds the blobs it fetched and none are dropped, so a
          # store grown past twice the tree starts over.
          if [ -d .git/objects ] && [ "$(du -sm .git/objects | cut -f1)" -gt 1500 ]; then
            echo "git store over 1500MB: fetching from scratch"; rm -rf .git
          fi
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          auth=$(printf 'x-access-token:%s' "${TOKEN:-}" | base64 -w0)
          git -c protocol.version=2 -c "http.extraheader=AUTHORIZATION: basic $auth" \
            fetch --no-tags --no-recurse-submodules --depth=1 origin "+$GITHUB_SHA:refs/remotes/origin/master"
          git checkout -q --force -B master refs/remotes/origin/master
          git update-ref refs/ct/base HEAD
          echo "git store: $(du -sm .git/objects | cut -f1)MB"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # No Set up Node: nothing this job runs calls node (the smoke test is
      # tests.yml's), and the actions bring their own. It was 5s a run.
      # tools/og_palette.py, which make_og.sh runs on every card.
      - name: Install Pillow
        run: pip install pillow
      # tools/row_cache.py's store: each puzzle's index row, difficulty inputs
      # and card facts, keyed on its file's git blob and the code that made
      # them, so the reindex and the card list re-read only the puzzles a push
      # changed. It lives under .git/, so it was empty on every CI checkout and
      # every run re-scored all ~50k files. code_reach's own store saves it
      # re-parsing tools/ for the keys. Per-commit key so each run saves;
      # restore-keys takes the newest. A stale or missing store is still
      # correct, just slow: a row is reused only when its key matches.
      - name: Restore the row cache
        uses: actions/cache/restore@v5
        with:
          path: |
            .git/ct-rows.sqlite*
            ~/.cache/cryptic-teacher/code_reach
          key: row-cache-${{ github.sha }}
          restore-keys: row-cache-
      # tools/clue_index.py's store of every puzzle file's clue keys, by git
      # blob: the authored puzzle's write checks that its clues are not a held
      # puzzle's (fetch_puzzle.check_not_copy), and without the store that
      # parses all ~50k files, ~25s of a 30s step. A step of its own, not a
      # path of the row cache: a cache's paths are part of its version, so
      # adding one would have emptied the row store for a run.
      - name: Restore the clue index
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/cryptic-teacher/clue-keys-*.sqlite*
          key: clue-index-${{ github.sha }}
          restore-keys: clue-index-
      # app.js reads the glossary from a <script> tag, so the file has to exist
      # before anything hashes it. That is this early because --reindex restamps
      # index.html on its way past, not only the stamping step further down.
      - name: Build the glossary table
        run: python3 tools/build_abbreviations.py
      # puzzles/index.* and the ?v= stamp index.html points at them with are
      # generated from the puzzle files, so the build regenerates them here
      # rather than trusting whatever was committed. The pre-reset backfill
      # commits ONE puzzle per push on purpose, without the index, and rebuilds
      # it only in its republish step at the end of the night — so every commit
      # in between carries an index that does not describe the tree, and the
      # smoke test failed the deploy for it (2026-09-15, everyman-4168). Before
      # the pages and the stamps, both of which read what this writes.
      #
      # The same command builds puzzles/<id>.js from puzzles/<series>/<year>/<id>.json first.
      # A clone has only the .json files, and app.js loads a puzzle by injecting
      # a <script> tag — it cannot fetch(), because the site is openable from
      # file://. The two are one step rather than two because the index hashes
      # the shim bytes, so indexing without building is not a thing that can be
      # correct.
      # Our own puzzle is built from its clues rather than committed (see
      # tools/test_build_authored_puzzle.sh). Its series is unlisted in
      # tools/series.py, so the reindex below files it where only ?p=authored-1
      # finds it. Before the reindex, which builds its shim.
      - name: Build the authored puzzle
        run: >-
          python3 tools/build_authored_puzzle.py
          --clues tools/data/authored_A001_clues.json --number 1
          --date 2026-07-29
          --annotated-by claude-opus-5-5
      # Last run's puzzles/<id>.js shims. A stored index row is reused only
      # when the shim on disk is the one it wrote (fetch_puzzle.index_row_deps
      # hashes it), and a fresh checkout has none, so without these every one
      # of the ~50k rows missed and was made again: the reindex's ~50s. A
      # stale shim is never used: its row's key or deps no longer match, and
      # the row and shim are written again.
      - name: Restore the puzzle shims
        uses: actions/cache/restore@v5
        with:
          path: puzzles/*.js
          key: puzzle-shims-${{ github.sha }}
          restore-keys: puzzle-shims-
      # Then a restored shim the index no longer names (its puzzle deleted or
      # renamed since) is removed, so the site ships what a clean build would.
      - name: Build the puzzle shims and reindex
        run: |
          python3 tools/fetch_puzzle.py --reindex
          python3 - <<'EOF'
          import json, pathlib
          d = pathlib.Path("puzzles")
          index = json.loads((d / "index.json").read_text(encoding="utf-8"))
          keep = {"index.js"} | {p["file"] for p in index["puzzles"] + index.get("unlisted", [])}
          gone = [f for f in d.glob("*.js") if f.name not in keep]
          for f in gone:
              f.unlink()
          print(f"removed {len(gone)} shim(s) no puzzle has")
          EOF
      # The cards are ~570MB of PNGs (run 38460299301) that change a few files
      # a night, so they are neither committed nor redrawn from scratch: the cache carries them and
      # their manifest between runs, and make_og.sh draws only the ones whose
      # inputs have moved. A cold cache costs a full redraw and is correct, just
      # slow. The key is per-commit so every run saves what it drew; restore-keys
      # is what actually hits, taking the newest cache from any earlier commit.
      - name: Restore the social cards
        uses: actions/cache/restore@v5
        with:
          path: og
          key: og-cards-${{ github.sha }}
          restore-keys: og-cards-
      # Before the pages, which point a puzzle at its own card only if the file
      # is already on disk — built the other way round, a new puzzle would
      # advertise the site card instead of its own.
      # A card is redrawn only when the HTML it is screenshot from changes
      # (make_og_card.card_key), so a push redraws the cards of the puzzles it
      # touched and an edit to the drawing code redraws only the cards whose
      # picture it moved. OG_LIMIT caps one run's drawing at ~1s a card so a
      # change that does move every card (a template redesign) drains over
      # later runs instead of holding this deploy past its budget.
      - name: Draw the social cards
        run: bash tools/make_og.sh --all
        env:
          OG_LIMIT: "120"
      # Last build's puzzle pages and their keys (tools/page_cache.py): a page
      # is rendered again only when its puzzle file, index row, neighbours,
      # card or stamped assets moved, or the code a puzzle page runs (what
      # code_reach says its render reaches) or a data file that code names
      # did; a fetcher, a test or a doc moves none of them. A push
      # that files one puzzle re-renders a handful of the ~50k, not all of
      # them. A cold cache renders everything, which is correct, just slow.
      # Restored here, saved (Save the puzzle pages) only after a big
      # re-render: saving ~67k pages takes about a minute, and a stale cache
      # costs only the few pages each later push moved.
      - name: Restore the puzzle pages
        uses: actions/cache/restore@v5
        with:
          path: |
            puzzles/*/index.html
            .page-cache.pickle
          key: seo-pages-${{ github.sha }}
          restore-keys: seo-pages-
      - name: Generate the crawlable pages
        id: pages
        run: python3 tools/build_seo_pages.py
      # Every page that is not a puzzle gets a card of its own title and
      # description, so these are drawn from the pages and come after them.
      # Their URLs are stamped with a hash of what they are drawn from, not of
      # the PNG, which is what lets the pages link them first.
      - name: Draw the page cards
        run: bash tools/make_og.sh --pages
      - name: Stamp the assets
        run: python3 tools/stamp_assets.py
      # The pages this deploy changes, for IndexNow once it is live. The cache
      # carries the last build's page hashes; a cold one sends the recent
      # sitemap (see tools/indexnow.py). Restored before the site checks
      # start, since one of them reads it.
      - name: Restore the IndexNow manifest
        uses: actions/cache/restore@v5
        with:
          path: .indexnow
          key: indexnow-${{ github.sha }}
          restore-keys: indexnow-
      # Only the site goes up, not the checkout: tools/stage_site.py names
      # what PUBLISH covers as a tar file list, and tar reads those files
      # where they are. It used to hard-link all ~138k into _site/ first,
      # 23s of a 45s step (run 38385716791) for a tree only tar read.
      - name: List the site
        run: python3 tools/stage_site.py --list "$RUNNER_TEMP/site.list"
      # Both read every published page (~67k, the link check across the
      # cores) and neither writes anything the archive holds, so they run
      # in the background beside Archive and Upload, which wait on the disk
      # and the network, instead of in front of them: 22s + 8s that used to
      # sit in series (run 38385716791). Wait for the site checks collects
      # them before the deploy, so a broken link still ships nothing.
      - name: Start the site checks
        run: |
          # Each detached from the step's output, or the runner holds the step
          # open on the inherited pipe (5s in run 38389462732).
          (python3 tools/stage_site.py --check "$RUNNER_TEMP/site.list" \
             > "$RUNNER_TEMP/links.log" 2>&1; echo $? > "$RUNNER_TEMP/links.rc") \
             < /dev/null > /dev/null 2>&1 &
          (python3 tools/indexnow.py changed . .indexnow/manifest.json indexnow-urls.txt "$RUNNER_TEMP/site.list" \
             > "$RUNNER_TEMP/indexnow.log" 2>&1; echo $? > "$RUNNER_TEMP/indexnow.rc") \
             < /dev/null > /dev/null 2>&1 &
      # What actions/upload-pages-artifact does, minus its tar -v (a log line
      # per file, ~140k of them) and stored rather than deflated. The upload
      # is bound by compressing, not by the network: level 6 took 65s, level
      # 1 40s and still came out at 1.05GB (run 38370347047). Same name and layout (one
      # artifact.tar in an artifact called github-pages, members ./-relative,
      # directories included), which is all deploy-pages reads.
      - name: Archive the site
        run: |
          tar --dereference --no-recursion -cf "$RUNNER_TEMP/artifact.tar" -T "$RUNNER_TEMP/site.list"
          echo "artifact.tar: $(( $(stat -c %s "$RUNNER_TEMP/artifact.tar") / 1000000 ))MB"
      - name: Upload the site
        uses: actions/upload-artifact@v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      # The background checks' results. A check that died without writing
      # its exit code (or hung) is caught by the timeout, and fails the
      # deploy the same way a broken link does.
      - name: Wait for the site checks
        timeout-minutes: 5
        run: |
          while [ ! -f "$RUNNER_TEMP/links.rc" ] || [ ! -f "$RUNNER_TEMP/indexnow.rc" ]; do sleep 1; done
          cat "$RUNNER_TEMP/indexnow.log" "$RUNNER_TEMP/links.log"
          [ "$(cat "$RUNNER_TEMP/links.rc")" = 0 ] && [ "$(cat "$RUNNER_TEMP/indexnow.rc")" = 0 ]
      # The deploy is a step of this job, not a job of its own: every job in
      # the old build -> deploy -> budgets chain waited 15-75s for a runner
      # and set itself up again, about a minute and a half of each run's
      # total. A failing check must still ship nothing, so the deploy waits
      # here for the validate job to finish and stops unless it passed. That
      # is nearly always already true: validate is done in a minute on a
      # puzzle push and in under five on a full check. Bounded by the
      # step's timeout, so a validate job that never reports cannot hold the
      # pages concurrency group.
      - name: Wait for the annotation check
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          JOBS: repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs
        run: |
          set -euo pipefail
          while :; do
            state=$(gh api "$JOBS" --jq '.jobs[] | select(.name == "validate") | "\(.status) \(.conclusion)"')
            case "$state" in
              "completed success") echo "validate passed"; exit 0 ;;
              completed*) echo "::error title=Not deployed::the validate job ended '$state'"; exit 1 ;;
            esac
            echo "validate: ${state:-not started}"
            sleep 10
          done
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
      # Only once the deploy succeeded, so Bing fetches what is live; a failed
      # ping leaves the site deployed and the run red, with IndexNow's reply
      # in the log.
      - name: Ping IndexNow
        run: python3 tools/indexnow.py ping indexnow-urls.txt
      # What this run's caches carry to the next, saved once the deploy has
      # succeeded and before the budgets are checked. Steps of their own, not
      # actions/cache's post-job saves: those run only when every step passed,
      # so a run that went red on Check the step budgets (a slow step, not a
      # broken site) saved nothing and the next run started cold and slower
      # still. Run 38370347047 failed its budgets and saved no shims or clue
      # index; 38376042604's reindex then took 119s instead of ~50s and its
      # authored puzzle 31s. Paths match each restore exactly: they are part
      # of the cache's version. tools/test_ci_checkout.sh checks each
      # restore has its save.
      - name: Save the git store
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .git/objects
            .git/shallow
            .git/refs/ct
          key: git-store-${{ github.sha }}
      - name: Save the row cache
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: |
            .git/ct-rows.sqlite*
            ~/.cache/cryptic-teacher/code_reach
          key: row-cache-${{ github.sha }}
      - name: Save the clue index
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/cryptic-teacher/clue-keys-*.sqlite*
          key: clue-index-${{ github.sha }}
      - name: Save the puzzle shims
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: puzzles/*.js
          key: puzzle-shims-${{ github.sha }}
      - name: Save the social cards
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: og
          key: og-cards-${{ github.sha }}
      - name: Save the IndexNow manifest
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: .indexnow
          key: indexnow-${{ github.sha }}
      # After everything the deploy needs, and only when this run rendered
      # many pages (a code change, a cold cache): see Restore the puzzle pages.
      - name: Save the puzzle pages
        if: ${{ !cancelled() && steps.deployment.outcome == 'success' && fromJSON(steps.pages.outputs.rendered || '0') > 2000 }}
        uses: actions/cache/save@v5
        with:
          path: |
            puzzles/*/index.html
            .page-cache.pickle
          key: seo-pages-${{ github.sha }}
      # Every step's time against its budget in tools/data/deploy_budgets.json,
      # read off the jobs API. After the deploy, never in front of it: a slow
      # build still ships, and the run goes red with an error naming the step,
      # which is how a regression gets noticed the day it lands instead of a
      # week later. A step with no budget row fails it too. Whatever failed
      # before it, so a broken build is still timed; check-run skips the steps
      # still running, this one among them, and the post-job cache saves.
      - name: Check the step budgets
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python3 tools/step_budgets.py check-run "$REPO" "$RUN_ID" "$ATTEMPT"

  # Its own job so it runs beside the build instead of in front of the
  # staging: it reads only the puzzle sources and tools/, none of what the
  # build generates. The build's deploy step waits for it (Wait for the
  # annotation check), so a failing check still ships nothing.
  #
  # Incremental, because the full check is minutes long and nearly every push
  # changes one puzzle file.
  # The base is the commit the last SUCCESSFUL run of this workflow deployed:
  # that run's check passed, so every puzzle as it stood there passed (by
  # induction from the last full check). A puzzle's check reads only its own
  # file, the validator's code and the data files that code opens, so when the
  # only changes since the base are added or edited puzzles/<series>/<year>/<id>.json
  # files (plus deleted puzzles, clues_only/ and docs/, which no check reads),
  # and nothing the check reads, checking just those files gives the full
  # check's answer. "Nothing the check reads" is computed, not listed:
  # tools/validate_scope.py takes the definitions code_reach says
  # validate_annotations.main reaches, compares them with the base's, and
  # looks for changed files by the names those modules mention. So an edit to
  # a fetcher, a test or a doc stays incremental; an edit to a rule, a table
  # or the workflow itself does not. A change to what the check reads, no base
  # to diff against, a manual run or the nightly schedule: the full check, as
  # before, spread across the runner's cores (validate_annotations.check_all).
  # The pre-commit hook runs the same --deploy check on each staged puzzle, so
  # this rarely finds anything new.
  #
  # The checkout fetches no file contents up front (blob:none), and only
  # tools/ and the workflows; the folders of the puzzles a run checks are
  # added after the diff, and a full run takes the whole tree, fetched in
  # four streams at once rather than one.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A job's permissions replace the workflow's, so this restates contents.
    permissions:
      contents: read
      actions: write  # reads the last successful run (its diff base); deletes stale CodeQL caches
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          filter: blob:none
          sparse-checkout: |
            tools
            .github/workflows
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Choose what to check
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The whole tree, as four fetches at once: one stream of ~50k blobs
          # took ~55s, the bulk of this step on a full run. The checkout that
          # follows finds them local, and fetches any this missed itself.
          fetch_tree() {
            git ls-tree -r HEAD -- puzzles clues_only | awk '$1 != "160000" { print $3 }' | sort -u > "$RUNNER_TEMP/blobs"
            split -n l/4 "$RUNNER_TEMP/blobs" "$RUNNER_TEMP/blobs."
            for part in "$RUNNER_TEMP"/blobs.??; do
              git -c fetch.negotiationAlgorithm=noop fetch --no-tags --no-write-fetch-head \
                --recurse-submodules=no --filter=blob:none --stdin origin < "$part" &
            done
            wait || true
          }
          full() { echo "full check: $1"; fetch_tree || true; git sparse-checkout disable; echo "mode=full" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$EVENT" = push ] || full "a $EVENT run"
          base=$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?branch=master&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // empty' || true)
          [ -n "$base" ] || full "no successful run to diff against"
          git fetch --no-tags --depth=1 --filter=blob:none origin "$base" || full "could not fetch $base"
          python3 tools/validate_scope.py "$base" > "$RUNNER_TEMP/scope.txt" || full "could not work out what changed"
          head -n 1 "$RUNNER_TEMP/scope.txt"
          case "$(head -n 1 "$RUNNER_TEMP/scope.txt")" in
            full*) full "$(head -n 1 "$RUNNER_TEMP/scope.txt")" ;;
          esac
          tail -n +2 "$RUNNER_TEMP/scope.txt" > "$RUNNER_TEMP/check.txt"
          if [ -s "$RUNNER_TEMP/check.txt" ]; then
            sed 's|/[^/]*$||' "$RUNNER_TEMP/check.txt" | sort -u | xargs git sparse-checkout add
          fi
          echo "mode=files" >> "$GITHUB_OUTPUT"
      # The authored puzzle is built from its clues, not committed, and the
      # check covers it like any other puzzle. Its inputs are under tools/, and
      # a change to them is one of the things validate_scope.py makes a full
      # check, so only a full check can see it change.
      - name: Build the authored puzzle
        if: steps.scope.outputs.mode == 'full'
        run: >-
          python3 tools/build_authored_puzzle.py
          --clues tools/data/authored_A001_clues.json --number 1
          --date 2026-07-29
          --annotated-by claude-opus-5-5
      # Two steps rather than one with a branch, so each has its own budget in
      # tools/data/deploy_budgets.json: the full check's growth is tracked
      # there, and an incremental check that slows down is caught on its own.
      - name: Check every annotation
        if: steps.scope.outputs.mode == 'full'
        run: python3 tools/validate_annotations.py
      - name: Check the changed annotations
        if: steps.scope.outputs.mode == 'files'
        run: |
          if [ -s "$RUNNER_TEMP/check.txt" ]; then
            xargs python3 tools/validate_annotations.py --deploy < "$RUNNER_TEMP/check.txt"
          else
            echo "no puzzle changed since the last deploy"
          fi
      # GitHub's CodeQL default setup stores an overlay database (~50MB) per
      # language per push in this repo's Actions cache and never deletes one:
      # 196 of them were 9.6GB of the 11.3GB in use (2026-10-13). GitHub makes
      # room by evicting the least recently used entries, which are the
      # build's own (cards, shims, pages, the git store), so a deploy could
      # start cold for no reason of its own. CodeQL restores only the newest
      # per language, so the rest go. Here beside the build rather than in
      # it, and never failing the run: a failed trim costs cache space, not
      # a deploy.
      - name: Trim the CodeQL caches
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: python3 tools/trim_codeql_caches.py "$REPO"
